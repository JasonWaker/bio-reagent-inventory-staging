name: Deploy staging (local mode) to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: '主仓库 (bio-reagent-inventory) 要构建的分支、tag 或 commit SHA，留空为 main'
        required: false
        default: 'main'
  schedule:
    # 每天 00:23 CST（UTC 16:23）自动同步主仓库 main
    - cron: '23 16 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main project source
        uses: actions/checkout@v4
        with:
          repository: JasonWaker/bio-reagent-inventory
          ref: ${{ inputs.source_ref || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (with cloud API, same as production)
        run: npm run build
        env:
          VITE_API_BASE_URL: https://inventory-api.kakahealthy.cn/bio-reagent-inventory
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
